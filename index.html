<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTM Milestone Dashboard</title>
<style>
  :root{
    --blue:#2563eb; --blue-bg:#eff6ff; --blue-border:#bfdbfe;
    --ink:#1e293b; --ink-2:#475569; --ink-3:#94a3b8;
    --bg:#f1f5f9; --panel:#ffffff; --line:#e2e8f0;
    --red:#dc2626; --red-bg:#fef2f2; --orange:#ea580c; --orange-bg:#fff7ed;
    --green:#16a34a; --green-bg:#f0fdf4; --purple:#7c3aed; --purple-bg:#f5f3ff;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;}
  body{background:var(--bg);color:var(--ink);padding:24px;max-width:1280px;margin:0 auto;}
  /* header */
  .header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .header h1{font-size:22px;font-weight:700;letter-spacing:.2px;}
  .header .sub{font-size:13px;color:var(--ink-3);margin-top:2px;}
  .header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .lang-toggle{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;overflow:hidden;}
  .lang-toggle button{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--ink-2);font-weight:600;}
  .lang-toggle button.on{background:var(--blue);color:#fff;}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;}
  .btn:hover{border-color:var(--blue);color:var(--blue);}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.primary:hover{background:#1d4ed8;color:#fff;}
  .btn.danger:hover{border-color:var(--red);color:var(--red);}
  /* panels */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .panel-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;color:var(--ink-2);font-weight:600;}
  .field input,.field select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);background:#fff;min-width:150px;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--blue);}
  /* progress */
  .progress-wrap{flex:1;min-width:220px;}
  .progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-bottom:6px;}
  .progress-bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .3s;}
  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .stat .num{font-size:28px;font-weight:700;line-height:1.1;}
  .stat .lbl{font-size:12px;color:var(--ink-2);margin-top:4px;font-weight:600;}
  .stat.total .num{color:var(--ink);}
  .stat.done .num{color:var(--green);}
  .stat.overdue .num{color:var(--red);}
  .stat.soon .num{color:var(--orange);}
  .stat.overdue{border-color:#fecaca;background:linear-gradient(0deg,var(--red-bg),#fff);}
  .stat.soon{border-color:#fed7aa;background:linear-gradient(0deg,var(--orange-bg),#fff);}
  /* timeline */
  .lane{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .lane:last-child{margin-bottom:0;}
  .lane-name{width:150px;flex-shrink:0;font-size:12px;font-weight:700;color:var(--ink-2);text-align:right;}
  .lane-track{flex:1;position:relative;height:34px;background:var(--bg);border-radius:8px;}
  .lane-line{position:absolute;left:10px;right:10px;top:50%;height:2px;background:var(--line);}
  .dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:default;}
  .dot.s-done{background:var(--green);}
  .dot.s-overdue{background:var(--red);}
  .dot.s-soon{background:var(--orange);}
  .dot.s-normal{background:var(--blue);}
  .dot.s-reminder{background:#fff;box-shadow:0 0 0 2px var(--ink-3);}
  .tl-range{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:8px;padding-left:162px;}
  /* milestone groups */
  .group{margin-bottom:20px;}
  .group:last-child{margin-bottom:0;}
  .group-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .group-tag{font-size:12px;font-weight:700;color:#fff;background:var(--ink-2);padding:3px 12px;border-radius:99px;}
  .group-tag.media{background:var(--blue);}
  .group-tag.web{background:var(--purple);}
  .group-tag.region{background:var(--orange);}
  .group-tag.kol{background:var(--green);}
  .group-count{font-size:12px;color:var(--ink-3);}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;}
  .card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ink-3);border-radius:10px;padding:12px 14px;}
  .card.done{border-left-color:var(--green);}
  .card.overdue{border-left-color:var(--red);background:linear-gradient(90deg,var(--red-bg),#fff 40%);}
  .card.soon{border-left-color:var(--orange);background:linear-gradient(90deg,var(--orange-bg),#fff 40%);}
  .card.reminder-card{border-style:dashed;border-left-style:solid;border-left-color:var(--ink-3);background:var(--bg);}
  .date-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:8px;padding:8px 12px;margin-bottom:10px;}
  .m-date{font-size:19px;font-weight:800;color:var(--blue);letter-spacing:.2px;}
  .card.overdue .m-date{color:var(--red);}
  .card.soon .m-date{color:var(--orange);}
  .card.done .m-date{color:var(--green);}
  .card.reminder-card .m-date{color:var(--ink-2);font-weight:700;}
  .m-ddl{font-size:12px;font-weight:800;color:#fff;background:var(--ink-2);border-radius:99px;padding:3px 11px;white-space:nowrap;}
  .card.overdue .m-ddl{background:var(--red);}
  .card.soon .m-ddl{background:var(--orange);}
  .card.done .m-ddl{background:var(--green);}
  .m-title{font-size:14px;font-weight:700;margin-bottom:2px;}
  .m-desc{font-size:12px;color:var(--ink-2);margin-bottom:10px;line-height:1.5;}
  .badge-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center;}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border);}
  .badge.rule{background:#f8fafc;color:var(--ink-2);border-color:var(--line);font-family:Consolas,monospace;}
  .badge.locked{background:var(--purple-bg);color:var(--purple);border-color:#ddd6fe;}
  .badge.remind-b{background:#f8fafc;color:var(--ink-2);border-color:var(--line);}
  .link-btn{font-size:11px;color:var(--ink-3);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;}
  .link-btn:hover{color:var(--purple);}
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:fit-content;margin-bottom:8px;}
  .seg button{border:0;background:#fff;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--line);}
  .seg button:last-child{border-right:0;}
  .seg button.on-ns{background:#f1f5f9;color:var(--ink);font-weight:700;}
  .seg button.on-ip{background:var(--orange-bg);color:var(--orange);font-weight:700;}
  .seg button.on-done{background:var(--green-bg);color:var(--green);font-weight:700;}
  .ctrl-row{display:flex;flex-direction:column;gap:6px;}
  .ctrl-row input{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px;width:100%;}
  .ctrl-row input:focus{outline:none;border-color:var(--blue);}
  /* review */
  .review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .review-col{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .review-col .rc-head{padding:8px 14px;font-size:12px;font-weight:700;color:#fff;}
  .review-col.overdue-c .rc-head{background:var(--red);}
  .review-col.soon-c .rc-head{background:var(--orange);}
  .review-col.mid-c .rc-head{background:var(--blue);}
  .rc-body{padding:10px 14px;min-height:60px;}
  .rc-item{font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line);color:var(--ink-2);line-height:1.5;}
  .rc-item:last-child{border-bottom:0;}
  .rc-item b{color:var(--ink);}
  .empty-hint{color:var(--ink-3);font-size:13px;padding:8px 0;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;}
  .toast.show{opacity:.95;}
  .sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3);}
  .sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);}
  .sync.live i{background:var(--green);box-shadow:0 0 0 3px var(--green-bg);}
  .sync.offline{color:var(--red);} .sync.offline i{background:var(--red);}
  @media (max-width:860px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .review-grid{grid-template-columns:1fr;}
    .lane-name{width:90px;font-size:11px;}
    .tl-range{padding-left:102px;}
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1 id="hTitle"></h1>
    <div class="sub" id="hSub"></div>
  </div>
  <div class="header-actions">
    <span class="sync" id="syncPill" hidden><i></i><span></span></span>
    <div class="lang-toggle">
      <button id="langCn" onclick="setLang('cn')">中文</button>
      <button id="langEn" onclick="setLang('en')">EN</button>
    </div>
    <button class="btn" id="btnExport" onclick="exportData()"></button>
    <button class="btn" id="btnImport" onclick="document.getElementById('importFile').click()"></button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(this)">
    <button class="btn primary" id="btnCopy" onclick="copyReport()"></button>
  </div>
</div>

<div class="panel">
  <div class="panel-label" id="plSetup"></div>
  <div class="row">
    <div class="field">
      <label id="lblProject"></label>
      <div style="display:flex;gap:6px;">
        <select id="projSelect" onchange="switchProject(this.value)" style="min-width:180px;"></select>
        <button class="btn" id="btnRename" onclick="renameProject()"></button>
        <button class="btn" id="btnNew" onclick="newProject()"></button>
        <button class="btn danger" id="btnDel" onclick="deleteProject()"></button>
      </div>
    </div>
    <div class="field"><label id="lblPilot"></label><input type="date" id="inPilot" onchange="setBase('pilot',this.value)"></div>
    <div class="field"><label id="lblMP"></label><input type="date" id="inMP" onchange="setBase('mp',this.value)"></div>
    <div class="progress-wrap">
      <div class="progress-meta"><span id="progLbl"></span><span id="progNum"></span></div>
      <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    </div>
  </div>
</div>

<div class="stats" id="statsRow"></div>

<div class="panel" id="tlPanel">
  <div class="panel-label" id="plTimeline"></div>
  <div id="timelineBody"></div>
</div>

<div class="panel">
  <div class="panel-label" id="plMilestones"></div>
  <div id="groupsBody"></div>
</div>

<div class="panel">
  <div class="panel-label" id="plReview"></div>
  <div class="review-grid" id="reviewBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

/* ============ milestone definitions ============ */
const DEFS=[
  {key:'mediaGuide',   phase:'media',  badge:'P-21',        calc:(p,mp)=>addD(p,-21)},
  {key:'prKickoff',    phase:'media',  badge:'P-14',        calc:(p,mp)=>addD(p,-14)},
  {key:'pilotSample',  phase:'media',  badge:'Pilot Run',   calc:(p,mp)=>p, reminder:true},
  {key:'sampleRcv',    phase:'media',  badge:'P+10',        calc:(p,mp)=>addD(p,10)},
  {key:'contentReady', phase:'media',  badge:'P+38',        calc:(p,mp)=>addD(p,38)},
  {key:'embargo',      phase:'web',    badge:'CR+1st Mon',  calc:(p,mp,e)=>e.embargo, lockable:true},
  {key:'warmupAssets', phase:'web',    badge:'E-14',        calc:(p,mp,e)=>addD(e.embargo,-14)},
  {key:'warmup',       phase:'web',    badge:'E-7',         calc:(p,mp,e)=>addD(e.embargo,-7)},
  {key:'officialSite', phase:'web',    badge:'= Embargo',   calc:(p,mp,e)=>e.embargo},
  {key:'arrivalNA',    phase:'region', badge:'MP+30',       calc:(p,mp)=>addD(mp,30)},
  {key:'arrivalEMEA',  phase:'region', badge:'MP+60',       calc:(p,mp)=>addD(mp,60)},
  {key:'onshelfNA',    phase:'region', badge:'Arr+1st Mon', calc:(p,mp,e)=>e.onshelfNA, lockable:true},
  {key:'ecomReady',    phase:'region', badge:'OS-10',       calc:(p,mp,e)=>addD(e.onshelfNA,-10)},
  {key:'onshelfEMEA',  phase:'region', badge:'Arr+1st Mon', calc:(p,mp,e)=>e.onshelfEMEA, lockable:true},
  {key:'kolKickoff',   phase:'kol',    badge:'Arr-14',      calc:(p,mp)=>addD(addD(mp,30),-14)},
  {key:'kolSample',    phase:'kol',    badge:'Arrival',     calc:(p,mp)=>addD(mp,30), reminder:true}
];

/* ============ date helpers ============ */
function pd(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function nextMonday(d){const x=new Date(d);const add=((8-x.getDay())%7)||7;return addD(x,add);}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today0(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function daysFromToday(d){return Math.round((d-today0())/86400000);}

/* ============ config ============ */
// Fill these two values from Supabase > Project Settings > API to turn on the shared board.
// Leave them empty and the dashboard keeps data in each person's browser only.
const SUPABASE_URL='';
const SUPABASE_ANON_KEY='';

/* ============ state ============ */
const LS_KEY='tryx_gtm_dashboard_v2', PREF_KEY='gtm_dashboard_prefs_v1';
let state={lang:'cn', active:null, projects:{}};
let sb=null, mode='local', pendingRender=false;   // mode: local | connecting | live | offline

function loadLocal(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){const o=JSON.parse(raw);state.projects=o.projects||{};if(o.lang)state.lang=o.lang;if(o.active)state.active=o.active;return;}
  }catch(e){}
  // best-effort migration from old single-language boards
  for(const old of ['tryx_gtm_board_v1','tryx_gtm_board_en_v1']){
    try{
      const raw=localStorage.getItem(old);
      if(!raw)continue;
      const o=JSON.parse(raw);
      const projs=o.projects||o;
      for(const id in projs){
        const p=projs[id];
        const np={name:p.name||id, pilot:p.pilot||p.pilotRun||'', mp:p.mp||p.massProduction||'', ms:{}};
        const src=p.milestones||p.ms||{};
        for(const k in src){const s=src[k];np.ms[k]={status:s.status||'ns',owner:s.owner||'',note:s.note||'',lockedDate:s.lockedDate||s.locked||''};}
        state.projects['mig_'+id]=np;
      }
      if(Object.keys(state.projects).length){state.active=Object.keys(state.projects)[0];break;}
    }catch(e){}
  }
}
function loadPrefs(){try{const o=JSON.parse(localStorage.getItem(PREF_KEY)||'{}');if(o.lang)state.lang=o.lang;if(o.active)state.active=o.active;}catch(e){}}
function save(){
  try{
    if(mode==='local')localStorage.setItem(LS_KEY,JSON.stringify(state));
    else localStorage.setItem(PREF_KEY,JSON.stringify({lang:state.lang,active:state.active}));
  }catch(e){}
}
function T(){return I18N[state.lang];}
function ensureActive(){if(!state.projects[state.active])state.active=Object.keys(state.projects).sort((a,b)=>(state.projects[a].created||0)-(state.projects[b].created||0))[0]||null;}

/* ============ shared store (Supabase) ============ */
const shared=()=>mode!=='local';
function fromRow(r){return {name:r.name||'',pilot:r.pilot||'',mp:r.mp||'',created:Date.parse(r.created_at)||0,ms:{}};}
function msFromRow(r){return {status:r.status||'ns',owner:r.owner||'',note:r.note||'',lockedDate:r.locked_date||''};}
async function fetchAll(){
  const [a,b]=await Promise.all([sb.from('projects').select('*'),sb.from('milestones').select('*')]);
  if(a.error)throw a.error; if(b.error)throw b.error;
  const projects={};
  a.data.forEach(r=>projects[r.id]=fromRow(r));
  b.data.forEach(r=>{if(projects[r.project_id])projects[r.project_id].ms[r.key]=msFromRow(r);});
  state.projects=projects;ensureActive();
}
function onProjectChange(ev){
  if(ev.eventType==='DELETE'){delete state.projects[(ev.old||{}).id];ensureActive();}
  else{const r=ev.new;const ms=(state.projects[r.id]||{}).ms||{};state.projects[r.id]=Object.assign(fromRow(r),{ms});ensureActive();}
  render();
}
function onMilestoneChange(ev){
  if(ev.eventType==='DELETE'){const r=ev.old||{};const p=state.projects[r.project_id];if(p)delete p.ms[r.key];}
  else{const r=ev.new;const p=state.projects[r.project_id];if(p)p.ms[r.key]=msFromRow(r);}
  render();
}
function setMode(m){mode=m;renderStatus();}
function writeErr(res){
  if(res&&res.error){toast((state.lang==='cn'?'保存失败：':'Not saved: ')+res.error.message);fetchAll().then(()=>render(true)).catch(()=>{});}
}
function remote(fn){if(!shared())return;Promise.resolve().then(fn).then(writeErr,e=>writeErr({error:e}));}
async function connect(){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY||!window.supabase){loadLocal();return false;}
  loadPrefs();setMode('connecting');
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  try{await fetchAll();setMode('live');}catch(e){setMode('offline');}
  sb.channel('gtm-board')
    .on('postgres_changes',{event:'*',schema:'public',table:'projects'},onProjectChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'milestones'},onMilestoneChange)
    .subscribe(st=>{
      if(st==='SUBSCRIBED'){fetchAll().then(()=>{setMode('live');render();}).catch(()=>setMode('offline'));}
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')setMode('offline');
    });
  return true;
}

/* ============ computed milestones ============ */
function getMilestones(){
  const p=state.projects[state.active];
  if(!p||!p.pilot||!p.mp)return [];
  const pilot=pd(p.pilot), mp=pd(p.mp);
  const eff={
    embargo: p.ms.embargo&&p.ms.embargo.lockedDate ? pd(p.ms.embargo.lockedDate) : nextMonday(addD(pilot,38)),
    onshelfNA: p.ms.onshelfNA&&p.ms.onshelfNA.lockedDate ? pd(p.ms.onshelfNA.lockedDate) : nextMonday(addD(mp,30)),
    onshelfEMEA: p.ms.onshelfEMEA&&p.ms.onshelfEMEA.lockedDate ? pd(p.ms.onshelfEMEA.lockedDate) : nextMonday(addD(mp,60))
  };
  return DEFS.map(d=>({key:d.key,phase:d.phase,badge:d.badge,reminder:!!d.reminder,lockable:!!d.lockable,date:d.calc(pilot,mp,eff)}));
}
function cardStatus(m){
  const p=state.projects[state.active];
  if(m.reminder)return 'reminder';
  const st=(p.ms[m.key]||{}).status||'ns';
  if(st==='done')return 'done';
  const d=daysFromToday(m.date);
  if(d<0)return 'overdue';
  if(d<=7)return 'soon';
  return 'normal';
}

/* ============ render ============ */
function editing(){const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='SELECT');}
function renderStatus(){
  const el=document.getElementById('syncPill');if(!el)return;
  el.hidden=mode==='local';
  const cn=state.lang==='cn';
  el.className='sync '+mode;
  el.lastChild.textContent=mode==='live'?(cn?'实时同步':'Live'):mode==='connecting'?(cn?'连接中…':'Connecting…'):(cn?'连接中断，修改可能未保存':'Offline: changes may not save');
}
function render(force){
  if(!force&&editing()){pendingRender=true;return;}
  pendingRender=false;renderStatus();
  const t=T(), p=state.projects[state.active];
  document.documentElement.lang = state.lang==='cn'?'zh-CN':'en';
  document.title=t.title;
  document.getElementById('hTitle').textContent=t.title;
  document.getElementById('hSub').textContent=t.sub;
  document.getElementById('langCn').classList.toggle('on',state.lang==='cn');
  document.getElementById('langEn').classList.toggle('on',state.lang==='en');
  document.getElementById('btnCopy').textContent=t.copy;
  document.getElementById('plSetup').textContent=t.setup;
  document.getElementById('lblProject').textContent=t.project;
  document.getElementById('btnNew').textContent=t.newBtn;
  document.getElementById('btnDel').textContent=t.delBtn;
  document.getElementById('btnRename').textContent=t.renameBtn;
  document.getElementById('btnExport').textContent=t.exportBtn;
  document.getElementById('btnImport').textContent=t.importBtn;
  document.getElementById('lblPilot').textContent=t.pilot;
  document.getElementById('lblMP').textContent=t.mp;
  document.getElementById('progLbl').textContent=t.progress;
  document.getElementById('plTimeline').textContent=t.timeline;
  document.getElementById('plMilestones').textContent=t.milestones;
  document.getElementById('plReview').textContent=t.review;

  // project selector
  const sel=document.getElementById('projSelect');
  sel.innerHTML=Object.keys(state.projects).map(id=>'<option value="'+id+'"'+(id===state.active?' selected':'')+'>'+esc(state.projects[id].name)+'</option>').join('');
  if(p){
    document.getElementById('inPilot').value=p.pilot||'';
    document.getElementById('inMP').value=p.mp||'';
  }else{
    document.getElementById('inPilot').value='';document.getElementById('inMP').value='';
  }

  const ms=getMilestones();
  const real=ms.filter(m=>!m.reminder);
  const done=real.filter(m=>((p&&p.ms[m.key]||{}).status)==='done').length;
  const overdue=real.filter(m=>cardStatus(m)==='overdue').length;
  const soon=real.filter(m=>cardStatus(m)==='soon').length;

  document.getElementById('progNum').textContent=real.length?done+'/'+real.length:'—';
  document.getElementById('progFill').style.width=(real.length?Math.round(done/real.length*100):0)+'%';

  document.getElementById('statsRow').innerHTML=[
    ['total',real.length,t.statTotal],['done',done,t.statDone],
    ['overdue',overdue,t.statOverdue],['soon',soon,t.statSoon]
  ].map(s=>'<div class="stat '+s[0]+'"><div class="num">'+s[1]+'</div><div class="lbl">'+s[2]+'</div></div>').join('');

  renderTimeline(ms,t);
  renderGroups(ms,t);
  renderReview(ms,t);
}

function renderTimeline(ms,t){
  const body=document.getElementById('timelineBody');
  if(ms.length<2){body.innerHTML='<div class="empty-hint">'+T().needDates+'</div>';return;}
  const dates=ms.map(m=>m.date.getTime());
  const min=Math.min(...dates), max=Math.max(...dates);
  const span=(max-min)||1;
  const phases=['media','web','region','kol'];
  let html='';
  phases.forEach(ph=>{
    const items=ms.filter(m=>m.phase===ph);
    const dots=items.map(m=>{
      const pos=10+((m.date.getTime()-min)/span)*80;
      const cs=m.reminder?'s-reminder':'s-'+cardStatus(m);
      return '<div class="dot '+cs+'" style="left:'+pos+'%" title="'+esc(t.fmt(m.date))+' · '+esc((t.m[m.key]||{t:m.key}).t)+'"></div>';
    }).join('');
    html+='<div class="lane"><div class="lane-name">'+t.phases[ph]+'</div><div class="lane-track"><div class="lane-line"></div>'+dots+'</div></div>';
  });
  html+='<div class="tl-range"><span>'+t.fmt(new Date(min))+'</span><span>'+t.fmt(new Date(max))+'</span></div>';
  body.innerHTML=html;
}

function renderGroups(ms,t){
  const p=state.projects[state.active];
  const body=document.getElementById('groupsBody');
  if(!ms.length){body.innerHTML='<div class="empty-hint">'+(p?t.needDates:(state.lang==='cn'?'还没有项目。点击「新建」创建第一个项目，或用「导入备份」导入数据。':'No projects yet. Click New to create one, or use Import Backup.'))+'</div>';return;}
  const phases=['media','web','region','kol'];
  let html='';
  phases.forEach(ph=>{
    const items=ms.filter(m=>m.phase===ph);
    if(!items.length)return;
    const doneN=items.filter(m=>!m.reminder&&((p.ms[m.key]||{}).status)==='done').length;
    const realN=items.filter(m=>!m.reminder).length;
    html+='<div class="group"><div class="group-head"><span class="group-tag '+ph+'">'+t.phases[ph]+'</span><span class="group-count">'+(realN?doneN+'/'+realN+' '+t.done:'')+'</span></div><div class="cards">';
    items.forEach(m=>html+=cardHTML(m,t,p));
    html+='</div></div>';
  });
  body.innerHTML=html;
}

function cardHTML(m,t,p){
  const rec=p.ms[m.key]||{};
  const cs=cardStatus(m);
  const d=daysFromToday(m.date);
  const ddl=cs==='reminder'?'':(d===0?t.today:(d>0?'D-'+d:'D+'+Math.abs(d)));
  const dateTxt=t.fmt(m.date);
  const st=rec.status||'ns';
  let badges='<span class="badge rule">'+m.badge+'</span>';
  if(m.lockable){
    if(rec.lockedDate){badges+='<span class="badge locked">'+t.locked+'</span><button class="link-btn" onclick="unlock(\''+m.key+'\')">'+t.restore+'</button>';}
    else{badges+='<span class="badge">'+(state.lang==='cn'?'建议日期可锁定':'Suggested, lockable')+'</span>';}
    badges+='<input type="date" value="'+(rec.lockedDate||dstr(m.date))+'" onchange="lockDate(\''+m.key+'\',this.value)" style="border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:12px;width:140px;">';
  }
  let ctrl='';
  if(!m.reminder){
    ctrl='<div class="seg">'
      +'<button class="'+(st==='ns'?'on-ns':'')+'" onclick="setStatus(\''+m.key+'\',\'ns\')">'+t.ns+'</button>'
      +'<button class="'+(st==='ip'?'on-ip':'')+'" onclick="setStatus(\''+m.key+'\',\'ip\')">'+t.ip+'</button>'
      +'<button class="'+(st==='done'?'on-done':'')+'" onclick="setStatus(\''+m.key+'\',\'done\')">'+t.done+'</button>'
      +'</div>'
      +'<div class="ctrl-row">'
      +'<input placeholder="'+t.ownerPh+'" value="'+esc(rec.owner||'')+'" onchange="setField(\''+m.key+'\',\'owner\',this.value)">'
      +'<input placeholder="'+t.notePh+'" value="'+esc(rec.note||'')+'" onchange="setField(\''+m.key+'\',\'note\',this.value)">'
      +'</div>';
  }
  return '<div class="card '+(m.reminder?'reminder-card':cs)+'">'
    +'<div class="date-row"><span class="m-date">'+dateTxt+'</span><span class="m-ddl">'+ddl+'</span></div>'
    +'<div class="m-title">'+(t.m[m.key]||{t:m.key}).t+'</div>'
    +'<div class="m-desc">'+((t.m[m.key]||{d:''}).d)+'</div>'
    +'<div class="badge-row">'+bades_fix(badges,m,t)+'</div>'
    +ctrl
    +'</div>';
}
function bades_fix(b,m,t){return m.reminder?'<span class="badge remind-b">'+t.reminder+'</span>':b;}

function renderReview(ms,t){
  const p=state.projects[state.active]||{ms:{}};
  const real=ms.filter(m=>!m.reminder);
  const buckets={overdue:[],soon:[],mid:[]};
  real.forEach(m=>{
    const d=daysFromToday(m.date);
    const st=(p.ms[m.key]||{}).status||'ns';
    if(st==='done')return;
    if(d<0)buckets.overdue.push(m);
    else if(d<=7)buckets.soon.push(m);
    else if(d<=21)buckets.mid.push(m);
  });
  buckets.overdue.sort((a,b)=>a.date-b.date);
  buckets.soon.sort((a,b)=>a.date-b.date);
  buckets.mid.sort((a,b)=>a.date-b.date);
  const item=m=>{
    const st=(p.ms[m.key]||{}).status||'ns';
    const owner=(p.ms[m.key]||{}).owner||'';
    const d=daysFromToday(m.date);
    return '<div class="rc-item"><b>'+t.fmt(m.date)+'</b> · '+esc((t.m[m.key]||{t:m.key}).t)
      +(owner?' · '+esc(owner):'')+' <span style="color:'+(d<0?'var(--red)':'var(--ink-3)')+'">('+(d<0?'D+'+Math.abs(d):'D-'+d)+', '+t.statusMap[st]+')</span></div>';
  };
  const col=(cls,label,arr)=>'<div class="review-col '+cls+'"><div class="rc-head">'+label+' ('+arr.length+')</div><div class="rc-body">'
    +(arr.length?arr.map(item).join(''):'<div class="empty-hint">'+t.none+'</div>')+'</div></div>';
  document.getElementById('reviewBody').innerHTML=
    col('overdue-c',t.colOverdue,buckets.overdue)+col('soon-c',t.colSoon,buckets.soon)+col('mid-c',t.colMid,buckets.mid);
}

/* ============ actions ============ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function setLang(l){state.lang=l;save();render(true);}
function switchProject(id){state.active=id;save();render(true);}
function setBase(k,v){const p=state.projects[state.active];if(!p)return;p[k]=v;save();render(true);
  const id=state.active;remote(()=>sb.from('projects').update({[k]:v||null}).eq('id',id));}
function msWrite(key,patch,col){
  const p=state.projects[state.active];if(!p)return null;
  if(!p.ms[key])p.ms[key]={};Object.assign(p.ms[key],patch);save();
  const id=state.active;remote(()=>sb.from('milestones').upsert(Object.assign({project_id:id,key,updated_at:new Date().toISOString()},col),{onConflict:'project_id,key'}));
  return p;
}
function setStatus(key,st){if(msWrite(key,{status:st},{status:st}))render(true);}
function setField(key,f,v){msWrite(key,{[f]:v},{[f]:v});}
function lockDate(key,v){if(!v)return;if(msWrite(key,{lockedDate:v},{locked_date:v}))render(true);}
function unlock(key){const p=state.projects[state.active];if(!p||!p.ms[key])return;msWrite(key,{lockedDate:''},{locked_date:null});render(true);}
function createProject(id,proj){
  state.projects[id]=proj;state.active=id;save();render(true);
  remote(async()=>{
    const r=await sb.from('projects').upsert({id,name:proj.name,pilot:proj.pilot||null,mp:proj.mp||null,created_at:new Date(proj.created||Date.now()).toISOString()});
    if(r.error)return r;
    const rows=Object.keys(proj.ms||{}).map(k=>{const m=proj.ms[k];return {project_id:id,key:k,status:m.status||'ns',owner:m.owner||'',note:m.note||'',locked_date:m.lockedDate||null};});
    return rows.length?sb.from('milestones').upsert(rows,{onConflict:'project_id,key'}):r;
  });
}
function newProject(){
  const t=T();let i=1,name=t.newProjName;
  while(Object.values(state.projects).some(p=>p.name===name)){name=t.newProjName+' '+i;i++;}
  createProject('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),{name,pilot:'',mp:'',ms:{},created:Date.now()});
  document.getElementById('inPilot').focus();
}
function deleteProject(){
  const t=T();
  if(!state.active||!state.projects[state.active])return;
  if(!confirm(t.confirmDel))return;
  const id=state.active;
  delete state.projects[id];
  ensureActive();
  if(!state.active&&!shared())newProjectSilent();
  save();render(true);
  remote(()=>sb.from('projects').delete().eq('id',id));
}
function newProjectSilent(){const id='p'+Date.now();state.projects[id]={name:T().newProjName,pilot:'',mp:'',ms:{},created:Date.now()};state.active=id;}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200);}
function renameProject(){
  const p=state.projects[state.active];if(!p)return;
  const n=prompt(T().renamePrompt,p.name);
  if(n===null)return;const v=n.trim();if(!v)return;
  p.name=v;save();render(true);
  const id=state.active;remote(()=>sb.from('projects').update({name:v}).eq('id',id));
}
function exportData(){
  const data=JSON.stringify({app:'gtm-milestone-dashboard',version:2,exported:new Date().toISOString(),projects:state.projects,active:state.active},null,2);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download='gtm-dashboard-backup-'+dstr(today0())+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(T().exported);
}
function importData(input){
  const t=T(),f=input.files&&input.files[0];input.value='';
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let o;try{o=JSON.parse(rd.result);}catch(e){toast(t.importBad);return;}
    const projs=o&&o.projects;
    if(!projs||typeof projs!=='object'||Array.isArray(projs)){toast(t.importBad);return;}
    const clean={};
    for(const id in projs){
      const p=projs[id];if(!p||typeof p!=='object')continue;
      const ms={};
      for(const k in (p.ms||{})){const s=p.ms[k]||{};ms[k]={status:['ns','ip','done'].includes(s.status)?s.status:'ns',owner:String(s.owner||''),note:String(s.note||'')};if(/^\d{4}-\d{2}-\d{2}$/.test(s.lockedDate||''))ms[k].lockedDate=s.lockedDate;}
      const dt=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?v:'';
      clean[id]={name:String(p.name||id),pilot:dt(p.pilot),mp:dt(p.mp),ms};
    }
    if(!Object.keys(clean).length){toast(t.importBad);return;}
    if(!confirm(t.importConfirm))return;
    const ids=Object.keys(clean);
    ids.forEach((id,n)=>{clean[id].created=clean[id].created||Date.now()+n;createProject(id.replace(/[^A-Za-z0-9_-]/g,'_'),clean[id]);});
    if(clean[o.active])state.active=o.active.replace(/[^A-Za-z0-9_-]/g,'_');
    save();render(true);toast(t.imported);
  };
  rd.readAsText(f);
}
function newProjectSilent(){const id='p'+Date.now();state.projects[id]={name:T().newProjName,pilot:'',mp:'',ms:{}};state.active=id;}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800);}

function copyReport(){
  const t=T(),p=state.projects[state.active];
  const ms=getMilestones();
  if(!ms.length){toast(t.needDates);return;}
  const lines=[];
  lines.push('=== '+t.title+' : '+(p?p.name:'')+' ===');
  if(p&&p.pilot)lines.push('Pilot Run: '+p.pilot+(p.mp?'  |  Mass Production: '+p.mp:''));
  lines.push('');
  ['media','web','region','kol'].forEach(ph=>{
    const items=ms.filter(m=>m.phase===ph);
    if(!items.length)return;
    lines.push(t.reportPhases[ph]);
    items.forEach(m=>{
      const rec=(p.ms[m.key])||{};
      const d=daysFromToday(m.date);
      const ddl=m.reminder?'':(d===0?' ['+t.today+']':d>0?' [D-'+d+']':' [D+'+Math.abs(d)+']');
      const st=m.reminder?'':' | '+t.statusMap[rec.status||'ns']+(rec.owner?' | '+rec.owner:'')+(rec.note?' | '+rec.note:'');
      lines.push(t.fmt(m.date)+ddl+'  '+(t.m[m.key]||{t:m.key}).t+st);
    });
    lines.push('');
  });
  const text=lines.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast(t.copied),()=>fallbackCopy(text,t));
  }else fallbackCopy(text,t);
}
function fallbackCopy(text,t){
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast(t.copied);}catch(e){}
  document.body.removeChild(ta);
}

/* ============ init ============ */
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!editing())render(true);},0));
connect().then(isShared=>{
  if(!isShared&&(!state.active||!state.projects[state.active])){newProjectSilent();save();}
  ensureActive();render(true);
});
render(true);
</script>
</body>
